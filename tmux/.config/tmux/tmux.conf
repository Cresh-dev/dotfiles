# tmux config (tmux >= 3.2 reads ~/.config/tmux/tmux.conf).
# Prefix stays the default C-b: AeroSpace owns the alt-* shortcuts.

# ── Terminal ─────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"   # true color inside Ghostty
set -g focus-events on                          # lets vim notice focus changes
set -sg escape-time 10                          # default 500ms makes Esc lag in vim

# ── Behaviour ────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000
set -g base-index 1                             # 1 is next to 2 on the keyboard, 0 is not
setw -g pane-base-index 1
set -g renumber-windows on

# ── Keys ─────────────────────────────────────────────────
# Splits and new windows open in the current directory, not in $HOME
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Copy mode with vim keys, yank to the macOS clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# ── Status bar: ANSI colors only, so it follows Ghostty's theme ─
set -g status-position top
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=blue,bold] #S #[default]"
set -g status-right "#[fg=brightblack]%H:%M "
setw -g window-status-format "#[fg=brightblack] #I:#W "
setw -g window-status-current-format "#[fg=yellow,bold] #I:#W "
set -g pane-active-border-style "fg=blue"
set -g pane-border-style "fg=brightblack"
