# General settings
general {
    grace = 1
}

# Background settings
background {
    color = rgba(30, 30, 30, 1)  # Dark gray background
}

# Input field settings
input-field {
    size = 250, 50
    dots_size = 0.33
    outer_color = rgba(200, 200, 200, 0.6)  # Soft gray outer color
    inner_color = rgba(70, 70, 70, 0.9)  # Slightly lighter inner color
    position = 0, 80
    halign = center
    valign = bottom
    placeholder_text = <i>Enter password...</i>  # Simpler placeholder
}

# Time display
label {
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"  # AM/PM format
    color = rgba(180, 180, 180, 1)  # Light gray for time
    font_size = 120  # Slightly smaller font size for simplicity
    font_family = JetBrains Mono Nerd Font Mono Regular
    position = 0, -180  # Slight adjustment for cleaner look
    halign = center
    valign = top
}

# User display
label {
    text =  $USER
    color = rgba(180, 180, 180, 0.7)  # Softer white for user display
    font_size = 20  # Slightly smaller font
    position = 0, 30  # Adjusted positioning
    halign = center
    valign = bottom
}

